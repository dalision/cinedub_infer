# CineDub inference conda environment.
#
#   Python 3.10  |  PyTorch 2.10.0+cu128  |  CUDA 12.8
#
# Create with:
#   conda env create -f environment.yml
#   conda activate cinedub
#
# The pip section pins torch 2.10.0 wheels for CUDA 12.8.
# If you need a different CUDA line, install torch by hand
# from https://download.pytorch.org/whl/<cuXY> first, then
# `pip install -r requirements.txt` to layer the rest.
